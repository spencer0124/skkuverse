# Prose rules for every SKKUverse repository.
#
# Third-party packages are pinned by full release URL and fetched with
# `vale sync`, the same discipline as `save-exact=true` in the fleet's npm
# repos: versions are pinned here, the payload is not committed. Our own rules
# under styles/skkuverse/ are source and are committed.
#
# Vale is a single static Go binary. It never enters tools/, so the repos that
# clone tools/ and run it with the system python3 gain nothing to install.

StylesPath = styles
MinAlertLevel = warning

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.29.0/ai-tells.zip

[*.md]
BasedOnStyles = ai-tells, skkuverse

# Vale normally skips fenced code for us, but rules that need to see the markup
# itself run with `scope: raw`, which bypasses that. Without this, a code
# sample demonstrating bold gets reported as bold overuse - the documentation
# for a rule would violate the rule.
BlockIgnores = (?s) *(```.*?```)

# Flags every em dash. styles/skkuverse/EmDashDensity.yml measures density
# instead, which is the actual defect - an em dash is fine, twelve on a page
# is the tell.
ai-tells.EmDashUsage = NO

# Fires on the `title:` line of every document's frontmatter, which is metadata
# rather than prose, and on cross-references like "One level in: Container
# View", where the capitalised word is a document title and so is a proper
# noun. Both are the exception the rule itself names, and it has no way to see
# that.
ai-tells.ColonUsage = NO

# Runs with `scope: raw`, so it reads fenced code too and reports every long
# CLI flag as punctuation. Its own advice - backtick a literal - is already
# satisfied by the fence it is sitting inside. Documentation for a tool with
# `--check` and `--only` flags cannot satisfy it any other way.
ai-tells.DoubleHyphen = NO
